<title>{{TITULO}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: una hoja A4 por empleado, apiladas; índice de nombres arriba. */
:root{
  --bg:#eef1f2; --paper:#ffffff; --ink:#1d2a30; --muted:#5d6b72; --line:#d5dcdf;
  --accent:#0f6f6a; --good:#1d7a3f; --goodbg:#e3f2e7; --bad:#b3261e; --badbg:#fbe7e5;
  --display:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11181b;--paper:#1a2428;--ink:#e3eaec;--muted:#9aa9af;--line:#2e3c41;--accent:#4fb8b0;--good:#6fcf8f;--goodbg:#173322;--bad:#ff8a80;--badbg:#3a1d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11181b;--paper:#1a2428;--ink:#e3eaec;--muted:#9aa9af;--line:#2e3c41;--accent:#4fb8b0;--good:#6fcf8f;--goodbg:#173322;--bad:#ff8a80;--badbg:#3a1d1b;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.top{max-width:794px;margin:0 auto 16px}
.top h1{font-family:var(--display);font-weight:700;font-size:28px;margin:0;text-wrap:balance}
.top p{color:var(--muted);margin:4px 0 10px;max-width:65ch}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav a{font-family:var(--display);font-weight:600;font-size:15px;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--paper);padding:4px 12px;border-radius:4px}
nav a:hover,nav a:focus-visible{border-color:var(--accent);outline:none}
.hoja{max-width:794px;margin:0 auto 24px;background:var(--paper);border:1px solid var(--line);padding:28px 32px;display:flex;flex-direction:column;gap:10px}
.hh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
.eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:12px;color:var(--accent);font-weight:600}
h2{font-family:var(--display);font-size:30px;margin:0;line-height:1.1}
.sem{font-size:13px;color:var(--muted)}
h3{font-family:var(--display);font-size:17px;margin:8px 0 0;font-weight:700}
.lead{font-size:16.5px;font-weight:500;margin:2px 0;max-width:72ch;text-wrap:pretty}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-top:4px solid var(--line);padding:8px 10px}
.tile.good{border-top-color:var(--good)}.tile.bad{border-top-color:var(--bad)}
.td{font-size:12px;font-weight:600;margin-top:2px}.tile.good .td{color:var(--good)}.tile.bad .td{color:var(--bad)}
.j{color:var(--muted);font-size:11px}
.t td.l,.t th.l{text-align:left;white-space:normal}
.t.big{font-size:14px}
.res .lead{font-size:17px;font-weight:500}
.oc2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.t.sm{font-size:12px}.t.sm td{white-space:normal}
@media (max-width:640px){.oc2{grid-template-columns:1fr}}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cols3 .t{font-size:12.5px}
.tl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-family:var(--display);font-weight:600}
.tv{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.ts{font-size:12.5px;color:var(--muted)}
.tw{overflow-x:auto}
.t{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.t th,.t td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:right;white-space:nowrap}
.t th:first-child{text-align:left}
.t tr:first-child th{white-space:normal;font-family:var(--display);font-weight:600;color:var(--muted);font-size:12.5px;vertical-align:bottom}
.cmp th span{display:block;font-weight:500;font-size:11px}
.t td.good{color:var(--good);background:var(--goodbg);font-weight:600}
.t td.bad{color:var(--bad);background:var(--badbg);font-weight:600}
.t td.na{color:var(--muted)}
.t tr.ex th,.t tr.ex td{color:var(--muted);font-style:italic}
.t tr.ex td[colspan]{text-align:left;white-space:normal}
.sab{font-family:var(--display);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);border:1px solid var(--accent);padding:0 4px;margin-left:4px;font-style:normal}
.nota{font-size:12px;color:var(--muted);margin:0}
.cols{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-top:4px}
.box{padding:10px 14px;border-left:4px solid}
.box h3{margin:0 0 4px}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.mal{border-color:var(--bad);background:var(--badbg)}
.bien{border-color:var(--good);background:var(--goodbg)}
.firma{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:12px;margin-top:6px}
.pie{max-width:794px;margin:0 auto;font-size:12.5px;color:var(--muted)}
.pie ul{padding-left:18px}
@media (max-width:640px){.oc2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.t.sm{font-size:12px}.t.sm td{white-space:normal}
@media (max-width:640px){.oc2{grid-template-columns:1fr}}
.cols3{grid-template-columns:1fr}.hoja{padding:18px 16px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:1fr}h2{font-size:25px}}

@page{size:A4;margin:9mm}
@media print{
 :root{--bg:#fff;--paper:#fff;--ink:#111;--muted:#555;--line:#ccc;--good:#16632f;--goodbg:#e6f3e9;--bad:#a4161a;--badbg:#fbe9e8;color-scheme:light}
 html,body{background:#fff}
 body{padding:0;font-size:8.6pt;line-height:1.35}
 .top,.pie{display:none}
 .hoja{max-width:none;margin:0;border:0;padding:0;gap:5px;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 h2{font-size:18pt}.lead{font-size:9.5pt}.res .lead{font-size:11pt}
 .tv{font-size:14pt}.tl,.ts,.td{font-size:7.5pt}
 .t,.t.big{font-size:7.2pt}.t th,.t td{padding:0.8px 4px}
 .tile{padding:5px 8px}
 .cols3 .t,.t.sm{font-size:7.2pt}
 h3{font-size:10pt;margin-top:2px}
 .box{padding:6px 9px}.box ul{gap:2px}
 .nota{font-size:7pt}
 .firma{font-size:8pt;padding-top:6px}
 .tile,.box,table,tr{break-inside:avoid}
}
</style>
<div class="top">
<h1>{{H1}}</h1>
<p>Una hoja por persona para conversar cara a cara, y un resumen por sector. Verde o rojo: contra {{CONTRA}}.</p>
<nav>{{NAV}}</nav>
</div>
